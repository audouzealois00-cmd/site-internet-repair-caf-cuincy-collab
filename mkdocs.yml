site_name: My Docs
nav:
  - Home: index.md
  - : about.md
  
nav_style: dark
theme:
  name: material
  language: fr
  palette:
    # Mode clair ou sombre automatique / par défaut
    scheme: default
    primary: teal       # Couleur principale (ex: teal, indigo, blue, green...)
    accent: light blue  # Couleur d'accentuation
  features:
    - navigation.tabs   # Active les onglets horizontaux en haut
    - navigation.top    # Bouton retour en haut de page
    - search.suggest    # Suggestions automatiques dans la recherche  
  extra_css:
    - stylesheets/extra.css

include_homepage_in_sidebar: True
titles_only: True
sticky_navigation: True
locale: en 
locale: fr
locale: de


  
  
