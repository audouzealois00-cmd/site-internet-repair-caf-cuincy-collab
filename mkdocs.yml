site_name: My Docs
nav:
  - Home: index.md
  - About: about.md
nav_style: dark
theme:
  name: material
  palette:
    # Mode clair ou sombre
    scheme: default
    # Couleur principale (ex: indigo, blue, red, teal...)
    primary: indigo
    # Couleur d'accentuation
    accent: light blue
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
  extra_css:
    - stylesheets/extra.css

include_homepage_in_sidebar: True
titles_only: True
sticky_navigation: True
locale: en 
locale: fr
locale: de


  
  
