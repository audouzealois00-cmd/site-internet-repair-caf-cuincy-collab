site_name: My Docs
nav:
  - Home: index.md
  - A propos: about.md
  - Rejoindre: rejoindre.md
  - Communauté: communauté.md
  - FAQ: faq.md
  - Contact: contacts.md
  
theme:
  name: material
  language: fr
  palette:
    # Mode clair ou sombre automatique / par défaut
    scheme: default
    primary: blue # Couleur principale (ex: teal, indigo, blue, green...)
    accent: light blue  # Couleur d'accentuation
  features:
    - navigation.tabs   # Active les onglets horizontaux en haut
    - navigation.top    # Bouton retour en haut de page
    - search.suggest    # Suggestions automatiques dans la recherche  
  extra_css:
    - stylesheets/extra.css

  
  
